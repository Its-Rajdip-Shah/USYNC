name: Bug report
description: Report a reproducible issue (never paste credentials or private course data).
title: 'bug: '
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem without sharing tokens, user IDs, grade data, or private URLs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce (with dummy data)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and OS versions
      placeholder: 'Python 3.12, macOS 15'
    validations:
      required: true
